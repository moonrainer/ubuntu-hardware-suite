[plan]
name = "ubuntu-base"
description = "Read-only Ubuntu host and driver readiness checks"

checks = [
  "host.os",
  "host.kernel",
  "cpu.identity",
  "cpu.ram_per_core",
  "firmware.microcode",
  "security.vulnerabilities",
  "cpu.topology",
  "cpu.cache",
  "cpu.numa",
  "cpu.frequency",
  "cpu.cstates",
  "cpu.cstates.residency",
  "cpu.clocksource",
  "ras.edac",
  "ras.throttle_history",
  "pci.driver_binding",
  "network.link",
  "storage.root",
  "gpu.render_device",
  "gpu.nvidia",
]
